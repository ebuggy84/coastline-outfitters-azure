name: Drift Detection

on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: "true"

jobs:
  detect-drift:
    name: Check for configuration drift
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Initialize
        run: terraform init -input=false

      - name: Check for drift
        id: plan
        run: |
          set +e
          terraform plan -detailed-exitcode -input=false -no-color -lock-timeout=60s
          code=$?
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          if [ $code -eq 1 ]; then
            exit 1
          fi
          exit 0

      - name: Report result
        run: |
          if [ "${{ steps.plan.outputs.exitcode }}" == "2" ]; then
            echo "::warning::Drift detected. The live environment no longer matches the committed configuration. Review the plan output above."
            exit 1
          else
            echo "No drift detected. Live environment matches the committed configuration."
          fi
